name: PowerShell validation

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          $files = Get-ChildItem -Path powershell -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' }

          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null

              if ($parseErrors.Count -gt 0) {
                  foreach ($error in $parseErrors) {
                      $allErrors += "${file}:$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)"
                  }
              }
          }

          if ($allErrors.Count -gt 0) {
              $allErrors | ForEach-Object { Write-Error $_ }
              throw "PowerShell parser found $($allErrors.Count) error(s)."
          }

          Write-Host "Parsed $($files.Count) PowerShell files successfully."

      - name: Validate test configuration JSON
        shell: pwsh
        run: |
          $config = Get-Content -Path config/test-cases.json -Raw | ConvertFrom-Json
          if (-not $config.patternTests) { throw 'patternTests is missing or empty.' }
          if (-not $config.regionTests) { throw 'regionTests is missing or empty.' }
          if (-not $config.cursorTests) { throw 'cursorTests is missing or empty.' }
          if (-not $config.idleTests) { throw 'idleTests is missing or empty.' }
          if (-not $config.motionTests) { throw 'motionTests is missing or empty.' }
          Write-Host 'Test configuration JSON is valid.'
